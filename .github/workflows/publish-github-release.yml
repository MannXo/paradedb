# workflows/publish-github-release.yml
#
# Publish GitHub Release
# Orchestrates fragment assembly, version syncing, and publishes a ParadeDB GitHub Release.
# This workflow is triggered manually via the GitHub Actions UI and deploys the branch that it is being run from.

name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, in semver format (e.g. 0.22.0)."
        type: string
        required: true
        default: ""
      beta:
        description: "Whether this release is a beta release. Defaults to false."
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-github-release-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-github-release:
    name: Publish ParadeDB GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PARADEDB_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PARADEDB_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Validate Release Inputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing release..."
          if gh release view v${{ github.event.inputs.version }} > /dev/null 2>&1; then
            echo "Release v${{ github.event.inputs.version }} already exists. All releases must be unique."
            exit 1
          fi
          echo "Release check passed!"

          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            echo "Validating that the version contains '-rc.X'..."
            if [[ "${{ github.event.inputs.version }}" != *"-rc."* ]]; then
              echo "Version (${{ github.event.inputs.version }}) does not contain '-rc.X' but is marked as a beta release."
              exit 1
            fi
          else
            echo "Validating that the version does not contain '-rc.X'..."
            if [[ "${{ github.event.inputs.version }}" == *"-rc."* ]]; then
              echo "Version (${{ github.event.inputs.version }}) contains '-rc.X' but is not marked as a beta release."
              exit 1
            fi
          fi

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "Validating that the version is a minor release on the main branch..."
            if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.0(-rc\.[0-9]+)?$ ]]; then
              echo "On releases of the 'main' branch, releases must be minor (patch = 0)."
              echo "Provided version '${{ github.event.inputs.version }}' is not a minor release."
              exit 1
            fi
          fi
          echo "Input validation passed!"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Assemble SQL Upgrade Scripts
        run: |
          ./scripts/assemble_sql.sh "${{ github.event.inputs.version }}"

      - name: Assemble Changelog
        run: |
          ./scripts/assemble_changelog.sh "${{ github.event.inputs.version }}"

      - name: Update Cargo Version and Lockfile
        run: |
          TARGET_VERSION="${{ github.event.inputs.version }}"
          # Update version in Cargo.toml
          python3 -c "
          import re
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'version = \"[^\"]+\"', f'version = \"${TARGET_VERSION}\"', content, count=1)
          with open('Cargo.toml', 'w') as f:
              f.write(content)
          "
          cargo check

      - name: Commit and Push Release Artifacts
        run: |
          git config user.name "paradedb-github-app[bot]"
          git config user.email "282009505+paradedb-github-app[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: Prepare \`${{ github.event.inputs.version }}\`."
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Determine if Release Should be Marked as Latest
        id: release_latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Beta releases should never be the latest release
          if [[ "${{ github.event.inputs.beta }}" == "true" ]]; then
            echo "is_latest=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          current_tag_version="${{ github.event.inputs.version }}"
          latest_tag_version=$(gh release list --jq '.[] | select(.isLatest == true) | .name' --json=name,isLatest | sed 's/^v//')
          echo "Current latest release is $latest_tag_version"
          echo "Current version to be released is $current_tag_version"

          echo ""
          echo "Install semver CLI via npm to compare versions..."
          npm install semver

          echo ""
          echo "Comparing versions to determine if the current version is the latest..."
          if npx semver -r ">$latest_tag_version" "$current_tag_version"; then
            echo "is_latest=true"
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false"
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Creating tag v${{ github.event.inputs.version }} pointing at $sha"
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v${{ github.event.inputs.version }}" \
            -f sha="$sha"

      # The tag_name will have "-rc.X" suffix and be marked as a prerelease for beta releases,
      # and no suffix and marked as a full release for prod releases. The tag has already been
      # created in the step above, so this step just attaches the release to it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: ${{ github.ref_name }} # Deploy the branch that this workflow is being run from
          prerelease: ${{ github.event.inputs.beta }} # Whether this release is a beta release
          make_latest: ${{ steps.release_latest.outputs.is_latest }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack on Failure
        if: failure()
        uses: paradedb/actions/slack-alert@v10
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          mention: "<!subteam^S0BLE20RYPM|@pg_search-maintainers>"
          title: "${{ github.workflow }} Failed"
